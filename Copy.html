<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>کپی کد سایت</title>
</head>
<body>
    <h1>کپی کد اصلی سایت</h1>
    <p>برای نمایش کد صفحه اصلی، روی دکمه نمایش کد بزنید.</p>

    <button onclick="showCode()">نمایش کد</button>
    <button onclick="copyCode()">کپی کد</button>

    <p id="status"></p>
    <textarea id="code" rows="30" cols="90" style="width:95%;" readonly></textarea>

    <p><a href="index.html">بازگشت به صفحه اول</a></p>

    <script>
        function showCode() {
            fetch("org.html")
                .then(function(response) {
                    return response.text();
                })
                .then(function(text) {
                    document.getElementById("code").value = text;
                    document.getElementById("status").innerHTML = "کد org.html نمایش داده شد.";
                })
                .catch(function() {
                    document.getElementById("status").innerHTML =
                        "کد بارگذاری نشد. فایل org.html را در ویرایشگر باز کنید.";
                });
        }

        function copyCode() {
            var box = document.getElementById("code");
            if (box.value === "") {
                showCode();
                document.getElementById("status").innerHTML = "ابتدا نمایش کد را بزنید؛ سپس دوباره کپی کد را بزنید.";
                return;
            }

            box.select();
            box.setSelectionRange(0, box.value.length);
            document.execCommand("copy");
            document.getElementById("status").innerHTML = "کد انتخاب شد؛ اگر مرورگر اجازه دهد کپی شده است.";
        }
    </script>
</body>
</html>
