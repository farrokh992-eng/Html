<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دانشگاه ملی مهارت</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #fff;
            color: #050505;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .main {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transform: translateY(-1vh);
            animation: appear 1.2s ease-out both;
        }

        .flag {
            width: 100%;
            height: clamp(48px, 12vh, 100px);
            opacity: 0;
            animation: stripe-in 1s ease-out forwards;
        }

        .green {
            background: #078500;
            animation-delay: 0.15s;
        }

        .red {
            background: #c90000;
            animation-delay: 0.45s;
        }

        .message {
            width: 100%;
            margin: 0;
            padding: 0 12px;
            text-align: center;
            font-size: clamp(25px, 5.2vw, 62px);
            line-height: 1.12;
            font-weight: 700;
            letter-spacing: -1px;
            opacity: 0;
            animation: text-in 1s ease-out 0.55s forwards;
        }

        .footer-links {
            position: fixed;
            bottom: 3px;
            left: 4px;
            display: flex;
            gap: 3px;
            direction: ltr;
            opacity: 0.13;
            transition: opacity 0.25s ease;
        }

        .footer-links:hover,
        .footer-links:focus-within {
            opacity: 0.35;
        }

        .footer-links a {
            display: block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #444;
            font-size: 0;
            text-decoration: none;
        }

        @keyframes appear {
            from { transform: translateY(8px); }
            to { transform: translateY(-1vh); }
        }

        @keyframes stripe-in {
            from { opacity: 0; transform: scaleX(0.94); }
            to { opacity: 1; transform: scaleX(1); }
        }

        @keyframes text-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                opacity: 1 !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>

    <main class="main">
        <div class="flag green"></div>

        <h1 class="message">
            Warning: This site does not work; it is only for nosy people to look at.
        </h1>

        <div class="flag red"></div>
    </main>

    <div class="footer-links">
        <a href="Copy.html" aria-label="Copy page" title="Copy">●</a>
        <a href="org.html" aria-label="Original page" title="Original">●</a>
    </div>

    <script>
        // انیمیشن‌ها با CSS اجرا می‌شوند؛ این بخش فقط ورود نرم صفحه را فعال می‌کند.
        document.addEventListener("DOMContentLoaded", function () {
            document.body.classList.add("loaded");
        });
    </script>

</body>
</html>
